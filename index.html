<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSSqueezy - Minify & Beautify CSS</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M18 15v6H6v-6l-4-4 4-4V3h12v4l4 4-4 4z' fill='%236c5ce7'/></svg>">
</head>
<body>
  <div class="container">
    <h1>CSSqueezy</h1>
    
    <div class="tabs">
      <button class="tab-btn active" data-tab="squeeze">Squeeze</button>
      <button class="tab-btn" data-tab="beautify">Beautify</button>
    </div>

    <div class="tab-content" id="squeeze-tab">
      <div class="textarea-container">
        <textarea id="input-squeeze" placeholder="Paste your CSS here..."></textarea>
        <textarea id="output-squeeze" readonly placeholder="Minified CSS..."></textarea>
      </div>
      <button id="squeeze-btn" class="btn">
        <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H7V5h10v14zM12 7v4h4v2h-4v4l-4-4 4-4z"/></svg>
        Squeeze CSS
      </button>
    </div>

    <div class="tab-content hidden" id="beautify-tab">
      <div class="textarea-container">
        <textarea id="input-beautify" placeholder="Paste minified CSS..."></textarea>
        <textarea id="output-beautify" readonly placeholder="Beautified CSS..."></textarea>
      </div>
      <button id="beautify-btn" class="btn">
        <svg viewBox="0 0 24 24"><path d="M12 6v3l4-4-4-4v3c-4.42 0-8 3.58-8 8 0 1.57.46 3.03 1.24 4.26L6.7 14.8c-.45-.83-.7-1.79-.7-2.8 0-3.31 2.69-6 6-6zm6.76 1.74L17.3 9.2c.44.84.7 1.79.7 2.8 0 3.31-2.69 6-6 6v-3l-4 4 4 4v-3c4.42 0 8-3.58 8-8 0-1.57-.46-3.03-1.24-4.26z"/></svg>
        Beautify CSS
      </button>
    </div>

    <button id="copy-btn" class="btn copy-btn">
      <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
      Copy
    </button>
  </div>

  <footer>
   <p>Made by <a href="https://github.com/LenaYork" target="_blank">Helen</a> | 2025 | CSSqueezy</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/cssbeautify@0.3.1/cssbeautify.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
